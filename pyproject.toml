[project]
name = "learn-transformers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eros Hacinas", email = "eros_hacinas@dlsu.edu.ph" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
learn-transformers = "learn_transformers:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"attention" = "src/learn_transformers/03-attn-mechanism/attention"
